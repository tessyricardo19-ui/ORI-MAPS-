<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ESGIS Connect</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c8102e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ESGIS">
<style>
:root{--bg:#f8f5f5;--card:#fff;--ink:#10202b;--mut:#66788a;--line:#eadfe0;--pri:#c8102e;--on:#fff;--acc:#c8102e;--ok:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f10;--card:#201718;--ink:#f6eeee;--mut:#b39c9e;--line:#38292b;--pri:#ff5d6c;--on:#2a0409;--ok:#5ccb92}}
:root[data-theme="dark"]{--bg:#150f10;--card:#201718;--ink:#f6eeee;--mut:#b39c9e;--line:#38292b;--pri:#ff5d6c;--on:#2a0409;--ok:#5ccb92}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:0 16px 28px}
h1{font:700 1.4rem/1.2 Georgia,serif;margin:0}h2{font:700 1rem system-ui;margin:22px 0 8px}
.sub{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
button,select,input{font:inherit;color:inherit}
button{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.97)}button.alt{background:transparent;color:var(--pri);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 12px}
label{font-size:.85rem;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;margin:12px 0}
.days button{flex:1;padding:9px 0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-size:.85rem}
.days button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.days button.today{box-shadow:inset 0 -3px 0 var(--acc)}
.next{background:var(--pri);color:var(--on);border:0}.next .sub{color:inherit;opacity:.8}
.c{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.t{font-weight:700;font-size:.9rem;line-height:1.25}.t small{display:block;color:var(--mut);font-weight:500}
.room{background:#fde6e9;color:#9b0c24;border-radius:8px;padding:4px 10px;font-weight:800;font-size:.85rem}
.next .room{background:#fff;color:#9b0c24}
.pin{border-left:5px solid var(--acc)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px}
.mb{width:44px;height:44px;background:none;padding:0;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:flex-start}
.mb i{display:block;width:24px;height:3px;background:var(--ink);border-radius:2px}
.logo{display:flex;align-items:center;gap:8px;font:800 1.15rem Georgia,serif;color:var(--pri)}
.logo svg{flex:none}.logo b{background:var(--pri);color:var(--on);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:1rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
aside{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--card);transform:translateX(-100%);transition:transform .25s;z-index:10;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 16px}
.open .ov{opacity:1;pointer-events:auto}.open aside{transform:none}
aside button{display:block;width:100%;text-align:left;background:none;color:var(--ink);margin-bottom:4px}
aside button.on{background:#fde6e9;color:#9b0c24}
.step{font-size:.88rem;color:var(--mut)}.step.d{color:var(--ok);font-weight:600}
.note{background:rgba(200,16,46,.09);border-radius:10px;padding:9px 12px;font-size:.84rem}
#v{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#v{animation:none}button{transition:none}}
.logo{flex-direction:column;align-items:center;gap:0;line-height:1}.lr{display:flex;align-items:center;gap:6px}.logo small{font:700 .72rem system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;margin-top:1px;padding-left:.34em}
a{color:var(--pri);font-weight:600}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jladqrdukbxjrtmdsycf.supabase.co';   // <-- à remplacer
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsYWRxcmR1a2J4anJ0bWRzeWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTgwNTYsImV4cCI6MjEwNjI5NDA1Nn0.yALMXCDcGn9KqW30J9Z7M0JE4YSvvCiY_JBuGeGozvI';                      // <-- clé "anon" (jamais la clé service_role)
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=['Lun','Mar','Mer','Jeu','Ven','Sam'],JL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const CAP='<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><polygon points="12,3 23,9 12,15 1,9"/><path d="M6 12.2V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-3.8L12 15.5z"/><rect x="20.4" y="9.5" width="1.2" height="6"/><circle cx="21" cy="16.5" r="1.4"/></svg>';
const logo=`<div class="logo"><span class="lr">ESGIS${CAP}</span><small>Connect</small></div>`;
const tj=new Date().getDay()-1;
const S={session:null,me:null,classes:[],tab:'cours',mode:'login',im:'inscription',f:'',n:'',j:tj>=0&&tj<6?tj:0,cours:[],ann:[],dos:[]};
const ok=r=>{if(r.error){alert(r.error.message);throw r.error}return r.data};
const admin=()=>S.me&&S.me.role=='admin',staff=()=>S.me&&S.me.role!='etudiant';
const cls=()=>S.classes.find(c=>c.filiere==S.f&&c.niveau==S.n);
const uniq=k=>[...new Set(S.classes.map(c=>c[k]))];
const hh=t=>String(t).slice(0,5);
async function loadCours(){const c=cls();S.cours=c?ok(await sb.from('cours').select('*').eq('class_id',c.id).order('debut')):[]}
async function loadAnn(){S.ann=ok(await sb.from('annonces').select('*').order('epingle',{ascending:false}).order('created_at',{ascending:false}))}
async function loadDos(){S.dos=ok(await sb.from('dossiers').select('*'+(admin()?', profiles(nom,matricule)':'')).order('created_at',{ascending:false}))}
async function load(){S.me=ok(await sb.from('profiles').select('*, classes(filiere,niveau)').eq('id',S.session.user.id).single());
 S.classes=ok(await sb.from('classes').select('*').order('filiere').order('niveau'));S.f=S.me.classes.filiere;S.n=S.me.classes.niveau;
 await Promise.all([loadCours(),loadAnn(),loadDos()])}
function pick(){return `<div class="g2"><div><label for="pf">Filière</label><select id="pf">${uniq('filiere').map(f=>`<option ${f==S.f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
<div><label for="pn">Niveau</label><select id="pn">${uniq('niveau').map(n=>`<option ${n==S.n?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>`}
function bindPick(cb){$('#pf').onchange=async e=>{S.f=e.target.value;await loadCours();cb()};$('#pn').onchange=async e=>{S.n=e.target.value;await loadCours();cb()}}

function auth(){const m=S.mode;
$('#app').innerHTML=`<div style="display:flex;justify-content:center;margin:28px 0 14px">${logo}</div>
<div class="card">${m=='signup'?'<label for="mat">Matricule</label><input id="mat" placeholder="Ex : ESG-2023-0142" autocomplete="off">':''}
<label for="em">Email</label><input id="em" type="email" autocomplete="email">
${m!='reset'?'<label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="'+(m=='login'?'current-password':'new-password')+'">':''}
<button id="go" style="width:100%">${{login:'Se connecter',signup:'Créer mon compte',reset:'Recevoir un lien'}[m]}</button><p id="msg" class="sub" style="margin:10px 0 0"></p></div>
<p style="text-align:center" class="sub">${m!='login'?'<a href="#" data-m="login">Se connecter</a> · ':''}${m!='signup'?'<a href="#" data-m="signup">Créer un compte</a> · ':''}${m!='reset'?'<a href="#" data-m="reset">Mot de passe oublié</a>':''}</p>`;
document.querySelectorAll('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();S.mode=a.dataset.m;auth()});
$('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw')?.value,mat=$('#mat')?.value.trim().toUpperCase(),msg=$('#msg');msg.textContent='';
 try{
  if(m=='login'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;S.session=(await sb.auth.getSession()).data.session;await load();render()}
  else if(m=='signup'){if(!mat)throw{message:'Entre ton matricule.'};const r=await sb.auth.signUp({email:em,password:pw,options:{data:{matricule:mat}}});if(r.error)throw r.error;
   if(r.data.session){S.session=r.data.session;await load();return render()}msg.textContent='Compte créé. Vérifie ton email pour le confirmer, puis connecte-toi.'}
  else{const{error}=await sb.auth.resetPasswordForEmail(em);if(error)throw error;msg.textContent='Si cet email existe, un lien a été envoyé.'}
 }catch(e){msg.textContent=/Database error|matricule/i.test(e.message)?'Matricule invalide ou déjà utilisé.':e.message}}}

function render(){if(!S.me)return auth();
const T=[['cours','Cours'],['ann','Annonces'],['insc','Inscription'],...(staff()?[['gest',admin()?'Administration':'Gestion']]:[])];
$('#app').innerHTML=`<header><button class="mb" id="mn" aria-label="Ouvrir le menu"><i></i><i></i><i></i></button>${logo}<span class="mb"></span></header><div id="v"></div>
<div class="ov" id="ov"></div><aside><h2 style="margin-top:0">Menu</h2><div class="sub" style="margin-bottom:10px">${esc(S.me.nom)}<br>${esc(S.me.matricule)}</div>${T.map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-t="${k}">${l}</button>`).join('')}<button id="q" style="margin-top:16px;color:var(--pri)">Se déconnecter</button></aside>`;
const B=document.body.classList;B.remove('open');$('#mn').onclick=()=>B.add('open');$('#ov').onclick=()=>B.remove('open');
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
$('#q').onclick=async()=>{await sb.auth.signOut();S.me=null;S.session=null;B.remove('open');auth()};
({cours:vC,ann:vA,insc:vI,gest:vG})[S.tab]()}

function vC(){const l=S.cours.filter(x=>x.jour==S.j),now=new Date(),mn=now.getHours()*60+now.getMinutes();
const nx=S.j==tj?l.find(x=>{const[h,m]=hh(x.debut).split(':');return +h*60+ +m>=mn}):null;
$('#v').innerHTML=`<h1>Emploi du temps</h1>${pick()}${nx?`<div class="card next"><div class="sub">Prochain cours aujourd'hui</div><div class="c"><span class="t">${hh(nx.debut)}</span><b>${esc(nx.matiere)}</b><span class="room">${esc(nx.salle)}</span></div></div>`:''}
<div class="days">${J.map((d,i)=>`<button class="${S.j==i?'on':''} ${i==tj?'today':''}" data-j="${i}">${d}</button>`).join('')}</div><h2>${JL[S.j]}</h2>
${l.map(x=>`<div class="card c"><span class="t">${hh(x.debut)}<small>${hh(x.fin)}</small></span><div><b>${esc(x.matiere)}</b><div class="sub">${esc(x.professeur||'')}</div></div><span class="room">${esc(x.salle)}</span></div>`).join('')||'<div class="card sub">Pas de cours ce jour-là.</div>'}`;
bindPick(vC);document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.j=+b.dataset.j;vC()})}

function vA(){$('#v').innerHTML='<h1>Annonces</h1><br>'+(S.ann.map(x=>`<div class="card ${x.epingle?'pin':''}"><b>${esc(x.titre)}</b><p style="margin:6px 0">${esc(x.message)}</p><span class="sub">${x.cible_class_id?'Ma classe':"Toute l'école"} · ${new Date(x.created_at).toLocaleDateString('fr-FR')}</span></div>`).join('')||'<div class="card sub">Aucune annonce pour le moment.</div>')}

function vI(){const r=S.im=='reinscription',lab={recu:1,verifie:2,valide:3,refuse:0};
$('#v').innerHTML=`<h1>Inscription en ligne</h1><div class="days"><button class="${!r?'on':''}" data-m="inscription">Nouvelle inscription</button><button class="${r?'on':''}" data-m="reinscription">Réinscription</button></div>
<div class="card"><label for="tel">Téléphone</label><input id="tel" inputmode="tel" placeholder="+229 ..."><label for="pay">Mode de paiement prévu</label><select id="pay"><option>MTN MoMo</option><option>Moov Money</option><option>Celtiis Cash</option><option>Au guichet</option></select>
<p class="note">Le dépôt des pièces et le paiement en ligne seront ajoutés dans une prochaine étape. Pour l'instant, le dossier est enregistré et suivi par la scolarité.</p><br><button id="sb" style="width:100%">Envoyer mon dossier</button></div><h2>Mes dossiers</h2>
${S.dos.filter(d=>d.user_id==S.me.id).map(d=>`<div class="card"><b>${d.type=='inscription'?'Inscription':'Réinscription'}</b> · ${new Date(d.created_at).toLocaleDateString('fr-FR')}${d.statut=='refuse'?'<div class="step" style="color:var(--pri)">Dossier refusé, contacte la scolarité</div>':['Dossier reçu','Vérifié par la scolarité','Inscription validée'].map((s,i)=>`<div class="step ${i<lab[d.statut]?'d':''}">${i<lab[d.statut]?'✔':'○'} ${s}</div>`).join('')}</div>`).join('')||'<div class="card sub">Aucun dossier envoyé.</div>'}`;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.im=b.dataset.m;vI()});
$('#sb').onclick=async()=>{const t=$('#tel').value.trim();if(!t)return alert('Renseigne ton téléphone.');
 ok(await sb.from('dossiers').insert({user_id:S.me.id,type:S.im,donnees:{tel:t,paiement:$('#pay').value,classe:S.me.classes}}));await loadDos();vI()}}

const csv=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(/\r?\n/).map(l=>l.split(/[;\t]/).map(x=>x.trim())).filter(c=>c.length>=4&&!/^(fili|matri)/i.test(c[0].replace(/^\ufeff/,''))));r.readAsText(f)});
async function vG(){if(!admin()&&(S.f!=S.me.classes.filiere||S.n!=S.me.classes.niveau)){S.f=S.me.classes.filiere;S.n=S.me.classes.niveau;await loadCours()}
const A=admin(),c=cls();
$('#v').innerHTML=`<h1>${A?'Administration':'Gestion'}</h1>${A?pick():`<div class="sub">${esc(S.f)} · ${esc(S.n)}</div>`}
<div class="card"><h2 style="margin-top:0">Ajouter un cours</h2><div class="g2"><div><label for="gj">Jour</label><select id="gj">${JL.map((j,i)=>`<option value="${i}">${j}</option>`).join('')}</select></div><div><label for="gh">Horaire</label><input id="gh" placeholder="08:00–10:00"></div></div>
<label for="gm">Matière</label><input id="gm"><div class="g2"><div><label for="gp">Professeur</label><input id="gp"></div><div><label for="gs">Salle</label><input id="gs"></div></div><button id="ac">Ajouter</button></div>
<div class="card"><h2 style="margin-top:0">Publier une annonce</h2><label for="at">Titre</label><input id="at"><label for="ad">Message</label><input id="ad">
${A?`<label for="ato">Destinataires</label><select id="ato"><option value="all">Toute l'école</option><option value="cl">${esc(S.f)} · ${esc(S.n)}</option></select><label><input type="checkbox" id="apin" style="width:auto;margin-right:8px">Épingler en haut</label><br><br>`:''}<button id="aa">Publier</button></div>
${A?`<div class="card"><h2 style="margin-top:0">Importer (CSV, séparateur ;)</h2><label>Emplois du temps<br><span class="sub">filière;niveau;jour;horaire;matière;professeur;salle</span><input type="file" id="ic" accept=".csv,.txt"></label>
<label>Matricules autorisés<br><span class="sub">matricule;nom;filière;niveau</span><input type="file" id="im" accept=".csv,.txt"></label></div>
<h2>Dossiers d'inscription</h2>${S.dos.map(d=>`<div class="card"><b>${esc(d.profiles?.nom)}</b> <span class="sub">${esc(d.profiles?.matricule)} · ${d.type}</span><select data-d="${d.id}">${['recu','verifie','valide','refuse'].map(s=>`<option ${s==d.statut?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<div class="card sub">Aucun dossier.</div>'}`:''}
<h2>Cours de ${esc(S.f)} · ${esc(S.n)} (${S.cours.length})</h2>${[...S.cours].sort((a,b)=>a.jour-b.jour||(a.debut>b.debut?1:-1)).map(x=>`<div class="card c"><span class="t">${J[x.jour]}<small>${hh(x.debut)}</small></span><div><b>${esc(x.matiere)}</b><div class="sub">${esc(x.professeur||'')} · ${esc(x.salle)}</div></div><button class="alt" data-rm="${x.id}">Retirer</button></div>`).join('')}`;
if(A)bindPick(vG);
$('#ac').onclick=async()=>{const m=$('#gm').value.trim(),s=$('#gs').value.trim();if(!m||!s)return alert('Matière et salle obligatoires.');const[d,f]=($('#gh').value||'08:00–10:00').split(/[–-]/);
 ok(await sb.from('cours').insert({class_id:c.id,jour:+$('#gj').value,debut:d.trim(),fin:(f||d).trim(),matiere:m,professeur:$('#gp').value||null,salle:s}));await loadCours();vG()};
$('#aa').onclick=async()=>{const t=$('#at').value.trim();if(!t)return;
 ok(await sb.from('annonces').insert({auteur:S.me.id,cible_class_id:A&&$('#ato').value=='all'?null:c.id,titre:t,message:$('#ad').value,epingle:A&&$('#apin').checked}));await loadAnn();S.tab='ann';render()};
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm('Retirer ce cours ?'))return;ok(await sb.from('cours').delete().eq('id',b.dataset.rm));await loadCours();vG()});
if(A){
 document.querySelectorAll('[data-d]').forEach(s=>s.onchange=async()=>{ok(await sb.from('dossiers').update({statut:s.value}).eq('id',s.dataset.d));await loadDos()});
 $('#ic').onchange=async e=>{const rows=await csv(e.target.files[0]),out=[];let ko=0;
  rows.forEach(r=>{const cl=S.classes.find(x=>x.filiere==r[0]&&x.niveau==r[1]),j=JL.findIndex(x=>x.toLowerCase()==r[2].toLowerCase()),[d,f]=(r[3]||'').split(/[–-]/);
   if(!cl||j<0||!d||r.length<7)return ko++;out.push({class_id:cl.id,jour:j,debut:d.trim(),fin:(f||d).trim(),matiere:r[4],professeur:r[5]||null,salle:r[6]})});
  if(out.length)ok(await sb.from('cours').insert(out));alert(out.length+' cours importés, '+ko+' ligne(s) ignorée(s).');await loadCours();vG()};
 $('#im').onchange=async e=>{const rows=(await csv(e.target.files[0])).map(r=>({matricule:r[0].toUpperCase(),nom:r[1],filiere:r[2],niveau:r[3]}));
  if(rows.length)ok(await sb.from('matricules').upsert(rows,{onConflict:'matricule'}));alert(rows.length+' matricules enregistrés.')}}}

(async()=>{try{const{data}=await sb.auth.getSession();S.session=data.session;if(S.session)await load();}catch(e){S.session=null}render()})();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
