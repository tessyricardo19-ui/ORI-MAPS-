<script>
/* ===== Multijoueur : Supabase Realtime (Presence + Broadcast) ===== */
const SUPABASE_URL='https://hejftinatjnmeyxoxnnk.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlamZ0aW5hdGpubWV5eG94bm5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzQwOTAsImV4cCI6MjEwODc1MDA5MH0.O4J1JOGaDcK8YjO7FS9AsGD4ViW0wKoLsI82rpKhxU4';
const RT=(()=>{
  let sb=null;
  const FAST=['x','y','f','z'];
  const ok=()=>!!window.supabase&&!/VOTRE/.test(SUPABASE_URL+SUPABASE_KEY);
  function client(){
    if(sb)return sb;
    if(!ok())return null;
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:20}}});
    return sb}
  async function join(name){
    const c=client();
    if(!c){const e=new Error('config');e.code='config';throw e}
    const id=Math.random().toString(36).slice(2,10);
    const ch=c.channel('cauri-'+name,{config:{broadcast:{self:true,ack:false},presence:{key:id}}});
    const P=new Map(),H=Object.create(null),cbs=[];
    let mineS={},mineF={},lastPos=0,posT=0,trkT=0,left=false;
    const ent=k=>{let e=P.get(k);if(!e){e={s:{},f:{}};P.set(k,e)}return e};
    ent(id);
    const peers=()=>{const a=[];P.forEach((e,k)=>{const me=k===id;a.push({peer:k,isMe:me,sameTab:me,presence:me?Object.assign({},mineS,mineF):Object.assign({},e.s,e.f)})});return a};
    const notify=()=>cbs.slice().forEach(f=>{try{f({peers:peers()})}catch(e){}});
    ch.on('presence',{event:'sync'},()=>{
      const st=ch.presenceState();
      P.forEach((e,k)=>{if(k!==id&&!st[k])P.delete(k)});
      Object.keys(st).forEach(k=>{if(k===id)return;const m=st[k][st[k].length-1];ent(k).s=(m&&m.d)||{}});
      notify()});
    ch.on('broadcast',{event:'pos'},m=>{
      const p=(m&&m.payload)||{};if(!p.id||p.id===id)return;
      ent(p.id).f={x:p.x,y:p.y,f:p.f,z:p.z}});
    ch.on('broadcast',{event:'ev'},m=>{
      const p=(m&&m.payload)||{},me=p.from===id,l=H[p.t];
      if(!Array.isArray(l))return;
      l.slice().forEach(f=>{try{f({topic:p.t,data:p.d,peer:p.from,isMe:me,sameTab:me})}catch(e){}})});
    function sendPos(){
      const now=Date.now();
      if(now-lastPos<66){if(!posT)posT=setTimeout(()=>{posT=0;sendPos()},66-(now-lastPos));return}
      lastPos=now;if(left)return;
      ch.send({type:'broadcast',event:'pos',payload:Object.assign({id},mineF)}).catch(()=>{})}
    await new Promise((res,rej)=>{
      let done=false;
      ch.subscribe((s,err)=>{
        if(s==='SUBSCRIBED'){ch.track({d:mineS});if(!done){done=true;res()}}
        else if(!done&&(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')){done=true;rej(Object.assign(new Error(s+(err?' - '+(err.message||err):'')),{code:s}))}})});
    return{
      peers,
      presence(patch){
        let sc=false,fc=false;
        for(const k in patch){const v=patch[k];
          if(FAST.includes(k)){mineF[k]=v;fc=true}
          else if(JSON.stringify(mineS[k])!==JSON.stringify(v)){mineS[k]=v;sc=true}}
        if(sc){clearTimeout(trkT);trkT=setTimeout(()=>{if(!left)ch.track({d:mineS})},40);notify()}
        if(fc)sendPos();
        return Promise.resolve()},
      onPeers(fn){cbs.push(fn);Promise.resolve().then(()=>fn({peers:peers()}));return()=>{const i=cbs.indexOf(fn);if(i>=0)cbs.splice(i,1)}},
      on(t,fn){(H[t]=H[t]||[]).push(fn);return()=>{const l=H[t]||[],i=l.indexOf(fn);if(i>=0)l.splice(i,1)}},
      emit(t,d){
        if(left)return Promise.reject(new Error('left'));
        return ch.send({type:'broadcast',event:'ev',payload:{t,d,from:id}}).then(r=>{if(r!=='ok')throw new Error(String(r))})},
      async leave(){
        left=true;clearTimeout(trkT);clearTimeout(posT);
        try{await ch.untrack()}catch(e){}
        try{await c.removeChannel(ch)}catch(e){}
        cbs.length=0;for(const k in H)delete H[k]}}}
  return{
    join,
    available:ok,
    why(){return !window.supabase?'Connexion Internet requise pour le multijoueur.':'Multijoueur non configuré : renseigne SUPABASE_URL et SUPABASE_KEY en haut du script.'}}
})();
const cv=document.getElementById('c'),W=640,H=360,GY=300;let x=cv.getContext('2d');
const NAMES=['Cotonou','Dantokpa','Ganvié','Grand-Popo','Ouidah','Bohicon','Abomey','Pendjari','Tanguiéta','Nuit du Roi'];
const TH=[['#5db8e8','#cfeefc','#b5532a','#3d9a3d'],['#6ac0ef','#f9e3b0','#a8602a','#6aa84f'],['#4aa3d9','#bfe9f5','#2a6f97','#8ecae6'],['#79c4ee','#fff1c4','#d9b36a','#8fbf5a'],['#f2994a','#fde2b8','#7a2e1a','#4c8f3a'],['#6aa8e0','#e0f0d0','#9c4a22','#3d8a3d'],['#c4783b','#fbd49a','#8c3b1b','#6a8f2e'],['#e8b15a','#fbe7b0','#b88a3c','#a5a542'],['#3b6f9c','#a8c8dc','#6b4a2b','#2f7a3a'],['#2a1a4a','#8a4a6a','#4a2020','#552266']];
let st='title',lvl=1,score=0,lives=3,cam=0,t=0,tm=0,LW,FLAG,CPX,S,C,F,SP=[],boss,player,saved=1;
/* Difficulté : ec=ennemis, es=vitesse, an=fourmis, sp=piques, gap=trous, hp=PV boss, cd=cadence boss (plus petit = plus agressif), lv=vies de départ, mx=vies max */
const DIFFS=[
{n:'FACILE',d:'Comme avant : 5 vies, boss plus faibles.',ec:1,es:1,an:.6,sp:.5,gap:1,hp:1,cd:1,lv:5,mx:6},
{n:'NORMAL',d:'Plus d\'ennemis, des fourmis, des piques, boss furieux.',ec:1.35,es:1.2,an:1,sp:1,gap:1.15,hp:1.5,cd:.85,lv:4,mx:5},
{n:'EXPERT',d:'Rapide, dense, boss très costauds. 3 vies.',ec:1.7,es:1.4,an:1.4,sp:1.3,gap:1.25,hp:2,cd:.7,lv:3,mx:4}];
let DIFF=1;try{const v=+localStorage.getItem('cr_diff');if(v>=0&&v<3&&localStorage.getItem('cr_diff')!==null)DIFF=v}catch(e){}
function cfg(){return MP?DIFFS[1]:DIFFS[DIFF]}
try{saved=Math.min(10,Math.max(1,+localStorage.getItem('sena_lvl')||1))}catch(e){}
const keys={};
let SEED=0,MP=false,room=null,PR=[],GH={},racing='',CODE='',fin=null,t0=0;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cow(a,b){C.push({x:a,y:b,t:0})}
function build(l){
  const r=rng(SEED+l*7919+13),K=cfg();S=[];C=[];F=[];SP=[];boss=null;let gid=0;
  {
    LW=2600+l*220;let x=0,len=650;CPX=0;
    while(x<LW){
      const end=Math.min(LW,x+len),L=end-x;S.push({x,y:GY,w:L,h:60,g:1});
      if(!CPX&&x>=LW/2)CPX=x+30;
      for(let i=0;i<3;i++)cow(x+L*0.3+i*30,GY-32);
      if(L>350&&r()<0.6){const px=x+60+r()*(L-220),py=GY-70-r()*50;S.push({x:px,y:py,w:100,h:16});for(let i=0;i<3;i++)cow(px+20+i*30,py-30)}
